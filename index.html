<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0d0f;
    color: white;
    font-family: Arial, Helvetica, sans-serif;

header {

}

.container {

.panel {

.panel h2 {

/* DURAK EKRANI */

.stop-window {

    gap: 9px;
}

.stop {
    height: 63px;

    border-radius: 9px;
    border-left: 6px solid #555;
    font-size: 17px;

    transition: 0.25s;
}

.stop.current {
    background: #30373c;
    border-left-color: #00c853;
}

    color: #777;

button {

    transition: 0.15s;
}

button:hover {
    filter: brightness(1.2);
}

button:active {

}

.red {

/* MODAL */

.modal-bg {

}

/* MOBİL */

@media(max-width:600px) {

    .buttons {
        grid-template-columns: 1fr;

    .stop {
        height: 58px;
        font-size: 14px;
        padding: 0 12px;
    }

    header h1 {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<header>
    <h1>İETT METROBÜS SİMÜLASYONU</h1>
    <p>34G • Beylikdüzü Son Durak → Söğütlüçeşme</p>
</header>

<div class="container">

    <!-- DURAKLAR -->

    <div class="panel">

        <h2>DURAKLAR</h2>

        <div id="stopWindow" class="stop-window"></div>

        <div id="status" class="status">
            Sistem hazır.
        </div>

    </div>


    <!-- ANA BUTONLAR -->

    <div class="panel">

        <h2>Kontroller</h2>

        <div class="buttons">

            <button class="red" onclick="announceCurrent()">
                🔊 Şimdiki Durak
            </button>

            <button class="blue" onclick="goNextStop()">
                ➡️ Sonraki Durak
            </button>

            <button class="orange" onclick="openSettings()">
                ⚙️ Ayarlar
            </button>

            <button class="help" onclick="openHelp()">
                🆘 Yardım
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     AYARLAR
     ===================================================== -->

<div id="settingsModal" class="modal-bg">

    <div class="modal">

        <h2>⚙️ Ayarlar</h2>

        <div class="climate-box">

            <strong>❄️ Klimaları Çalıştır</strong>

            <button class="green" onclick="toggleClimate()">
                Klimaları Çalıştır / Durdur
            </button>

            <button onclick="selectClimate(1)">
                1. Reon
            </button>

            <button onclick="selectClimate(2)">
                2. Reon
            </button>

            <button onclick="selectClimate(3)">
                3. Reon
            </button>

            <div id="climateStatus" class="status">
                Klimalar kapalı.
            </div>

        </div>

        <button class="red" onclick="restartSystem()">
            🔄 Sistemi Yeniden Başlat
        </button>

        <button class="close dark" onclick="closeSettings()">
            Kapat
        </button>

    </div>

</div>


<!-- =====================================================
     YARDIM
     ===================================================== -->

<div id="helpModal" class="modal-bg">

    <div class="modal">

        <h2>🆘 Yardım</h2>

        <div class="modal-buttons">

            <button class="red" onclick="call112()">
                📞 112 Acil Yardım Hattını Ara
            </button>

            <button onclick="helpAction('Sadece Yardım (Polis)')">
                👮 Sadece Yardım (Polis)
            </button>

            <button onclick="helpAction('Sadece Yardım (Ambulans)')">
                🚑 Sadece Yardım (Ambulans)
            </button>

            <button onclick="helpAction('Sadece Yardım (İtfaiye)')">
                🚒 Sadece Yardım (İtfaiye)
            </button>

            <button onclick="helpAction('Sadece Yardım (BİE)')">
                🆘 Sadece Yardım (BİE)
            </button>

            <button onclick="helpAction('Kaza Yaptım')">
                ⚠️ Kaza Yaptım
            </button>

            <button onclick="helpAction('Tacize Uğradım')">
                🚨 Tacize Uğradım
            </button>

            <button onclick="helpAction('Yolcudan Rahatsızım')">
                😟 Yolcudan Rahatsızım
            </button>

            <button onclick="helpAction('Tehdide Uğruyorum')">
                ⚠️ Tehdide Uğruyorum
            </button>

            <button onclick="helpAction('Rahatsızlık Geçirdim')">
                🏥 Rahatsızlık Geçirdim
            </button>

            <button onclick="helpAction('Yolcu Rahatsızlık Geçirdi')">
                🏥 Yolcu Rahatsızlık Geçirdi
            </button>

        </div>

        <button class="close dark" onclick="closeHelp()">
            Kapat
        </button>

    </div>

</div>


<script>

/* =====================================================
   DURAK LİSTESİ
   ===================================================== */

const stops = [

    "B. SON DURAK",
    "BEYKENT",
    "CUMHURİYET MAHALLESİ",
    "BEYLİKDÜZÜ BELEDİYESİ",
    "BEYLİKDÜZÜ",
    "GÜZELYURT",
    "HARAMİDERE",
    "HARAMİDERE SANAYİ",
    "SAADETDERE MAHALLESİ",
    "MUSTAFA KEMALPAŞA",

    "CİHANGİR - ÜNİVERSİTE MAHALLESİ",
    "AVCILAR MERKEZ ÜNİVERSİTE KAMPÜSÜ",
    "ŞÜKRÜBEY",
    "İSTANBUL BÜYÜKŞEHİR BELEDİYESİ SOSYAL TESİSLERİ",
    "KÜÇÜKÇEKMECE",
    "CENNET MAHALLESİ",
    "FLORYA",
    "BEŞYOL",
    "SEFAKÖY",
    "YENİBOSNA",
    "ŞİRİNEVLER",
    "BAHÇELİEVLER",
    "İNCİRLİ",
    "ZEYTİNBURNU",
    "MERTER",
    "TOPKAPI",
    "CEVİZLİBAĞ",
    "EDİRNEKAPI",
    "AYVANSARAY - EYÜPSULTAN",
    "HALICIOĞLU",
    "OKMEYDANI",
    "DARÜLACEZE - PERPA",
    "OKMEYDANI HASTANE",
    "ÇAĞLAYAN",
    "MECİDİYEKÖY",
    "ZİNCİRLİKUYU",
    "15 TEMMUZ ŞEHİTLER KÖPRÜSÜ",
    "BURHANİYE",
    "ALTUNİZADE",
    "ACIBADEM",
    "UZUNÇAYIR",
    "FİKİRTEPE",
    "SÖĞÜTLÜÇEŞME"

];


let currentIndex = 0;

let climateRunning = false;

let selectedClimate = null;

let announcementBusy = false;


/* =====================================================
   DURAKLARI GÖSTER
   SADECE 4 SATIR
   ===================================================== */

function renderStops() {

    const windowElement =
        document.getElementById("stopWindow");

    windowElement.innerHTML = "";

    for (let i = 0; i < 4; i++) {

        const stopIndex =
            currentIndex + i;

        const div =
            document.createElement("div");


        if (stopIndex < stops.length) {

            div.className = "stop";

            if (i === 0) {
                div.classList.add("current");
            }

            div.textContent =
                stops[stopIndex];

        } else {

            div.className =
                "stop empty";

            div.textContent =
                "....................";

        }

        windowElement.appendChild(div);
    }
}


/* =====================================================
   DİN-DON SESİ
   HARİCİ MP3 GEREKTİRMEZ
   ===================================================== */

function playDingDong() {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContext) {
        return;
    }


    const ctx =
        new AudioContext();


    const now =
        ctx.currentTime;


    /*
     * İLK SES: DİN
     */

    const osc1 =
        ctx.createOscillator();

    const gain1 =
        ctx.createGain();


    osc1.type = "sine";

    osc1.frequency.setValueAtTime(
        880,
        now
    );


    gain1.gain.setValueAtTime(
        0.0001,
        now
    );

    gain1.gain.exponentialRampToValueAtTime(
        0.30,
        now + 0.015
    );

    gain1.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.30
    );


    osc1.connect(gain1);

    gain1.connect(
        ctx.destination
    );


    osc1.start(now);

    osc1.stop(
        now + 0.32
    );


    /*
     * İKİNCİ SES: DON
     */

    const osc2 =
        ctx.createOscillator();

    const gain2 =
        ctx.createGain();


    osc2.type = "sine";

    osc2.frequency.setValueAtTime(
        660,
        now + 0.34
    );


    gain2.gain.setValueAtTime(
        0.0001,
        now + 0.34
    );

    gain2.gain.exponentialRampToValueAtTime(
        0.30,
        now + 0.355
    );

    gain2.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.70
    );


    osc2.connect(gain2);

    gain2.connect(
        ctx.destination
    );


    osc2.start(
        now + 0.34
    );

    osc2.stop(
        now + 0.72
    );


    setTimeout(() => {

        ctx.close();

    }, 1000);
}


/* =====================================================
   TÜRKÇE SES BUL
   WINDOWS'TA GENELLİKLE TOLGA
   ===================================================== */

function getTurkishVoice() {

    const voices =
        window.speechSynthesis.getVoices();


    let voice =
        voices.find(v => {

            const lang =
                (v.lang || "").toLowerCase();

            return lang === "tr-tr";

        });


    if (!voice) {

        voice =
            voices.find(v => {

                const lang =
                    (v.lang || "").toLowerCase();

                return lang.startsWith("tr");

            });

    }


    return voice || null;
}


/* =====================================================
   SESLİ ANONS
   ===================================================== */

function speak(text, onEnd = null) {

    if (!("speechSynthesis" in window)) {

        alert(
            "Bu tarayıcı sesli anonsu desteklemiyor."
        );

        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "tr-TR";


    /*
     * Yavaş ve anlaşılır anons.
     */

    utterance.rate =
        0.70;


    utterance.pitch =
        1.0;


    utterance.volume =
        1.0;


    const voice =
        getTurkishVoice();


    if (voice) {

        utterance.voice =
            voice;

    }


    utterance.onend =
        function() {

            announcementBusy =
                false;

            if (typeof onEnd === "function") {
                onEnd();
            }

        };


    utterance.onerror =
        function() {

            announcementBusy =
                false;

        };


    /*
     * DİN-DON bittikten sonra
     * sesli anons başlar.
     */

    setTimeout(() => {

        window.speechSynthesis.speak(
            utterance
        );

    }, 800);
}


/* =====================================================
   DİN-DON + ANONS
   ===================================================== */

function announceWithDingDong(text, callback = null) {

    if (announcementBusy) {
        return;
    }


    announcementBusy =
        true;


    window.speechSynthesis.cancel();


    /*
     * Önce elektronik DİN-DON.
     */

    playDingDong();


    /*
     * Sonra anons.
     */

    speak(
        text,
        callback
    );
}


/* =====================================================
   ŞİMDİKİ DURAK
   ===================================================== */

function announceCurrent() {

    if (announcementBusy) {
        return;
    }


    if (currentIndex >= stops.length) {

        setStatus(
            "Son durağa ulaşıldı."
        );


        announceWithDingDong(
            "Son durağa ulaşıldı."
        );


        return;
    }


    const stop =
        stops[currentIndex];


    setStatus(
        "Şimdiki Durak: " +
        stop
    );


    announceWithDingDong(
        "Şimdiki Durak... " +
        stop + "."
    );
}


/* =====================================================
   SONRAKİ DURAK
   ===================================================== */

function goNextStop() {

    if (announcementBusy) {
        return;
    }


    if (currentIndex >= stops.length - 1) {

        setStatus(
            "Son duraktasınız."
        );


        announceWithDingDong(
            "Son duraktasınız."
        );


        return;
    }


    currentIndex++;


    renderStops();


    const stop =
        stops[currentIndex];


    setStatus(
        "Sonraki Durak: " +
        stop
    );


    announceWithDingDong(
        "Sonraki Durak... " +
        stop + "."
    );
}


/* =====================================================
   DURUM
   ===================================================== */

function setStatus(message) {

    document.getElementById(
        "status"
    ).textContent =
        message;
}


/* =====================================================
   AYARLAR
   ===================================================== */

function openSettings() {

    document.getElementById(
        "settingsModal"
    ).style.display =
        "flex";
}


function closeSettings() {

    document.getElementById(
        "settingsModal"
    ).style.display =
        "none";
}


/* =====================================================
   KLİMA
   ===================================================== */

function toggleClimate() {

    climateRunning =
        !climateRunning;


    const status =
        document.getElementById(
            "climateStatus"
        );


    if (climateRunning) {

        if (selectedClimate) {

            status.textContent =
                selectedClimate +
                ". Reon çalışıyor.";

        } else {

            status.textContent =
                "Klimalar çalışıyor.";

        }

    } else {

        status.textContent =
            "Klimalar kapalı.";
    }
}


function selectClimate(number) {

    selectedClimate =
        number;


    const status =
        document.getElementById(
            "climateStatus"
        );


    if (climateRunning) {

        status.textContent =
            number +
            ". Reon çalışıyor.";

    } else {

        status.textContent =
            number +
            ". Reon seçildi.";
    }
}


/* =====================================================
   SİSTEMİ YENİDEN BAŞLAT
   ===================================================== */

function restartSystem() {

    window.speechSynthesis.cancel();


    currentIndex =
        0;


    climateRunning =
        false;


    selectedClimate =
        null;


    announcementBusy =
        false;


    renderStops();


    document.getElementById(
        "climateStatus"
    ).textContent =
        "Klimalar kapalı.";


    setStatus(
        "Sistem yeniden başlatıldı. İlk durağa dönüldü."
    );


    closeSettings();


    /*
     * Yeniden başlatma anonsu.
     */

    announceWithDingDong(
        "Sistem yeniden başlatıldı."
    );
}


/* =====================================================
   YARDIM
   ===================================================== */

function openHelp() {

    document.getElementById(
        "helpModal"
    ).style.display =
        "flex";
}


function closeHelp() {

    document.getElementById(
        "helpModal"
    ).style.display =
        "none";
}


/* =====================================================
   112 SİMÜLASYONU
   GERÇEK ARAMA YAPILMAZ
   ===================================================== */

function call112() {

    setStatus(
        "112 arandı. Bu bir simülasyondur."
    );


    alert(
        "112 arandı.\n\n" +
        "Bu bir simülasyondur. " +
        "Gerçek arama yapılmadı."
    );


    announceWithDingDong(
        "112 arandı. Bu bir simülasyondur."
    );


    closeHelp();
}


/* =====================================================
   YARDIM SEÇENEKLERİ
   ===================================================== */

function helpAction(action) {

    setStatus(
        action +
        " seçildi. Bu bir simülasyondur."
    );


    alert(
        action +
        "\n\n" +
        "Yardım talebi oluşturuldu.\n" +
        "Bu bir simülasyondur."
    );


    announceWithDingDong(
        action +
        ". Yardım talebi oluşturuldu."
    );


    closeHelp();
}


/* =====================================================
   BAŞLANGIÇ
   ===================================================== */

renderStops();


/*
 * Windows/Tarayıcı seslerini yükle.
 */

if ("speechSynthesis" in window) {

    window.speechSynthesis.getVoices();


    window.speechSynthesis.onvoiceschanged =
        function() {

            window.speechSynthesis.getVoices();

        };
}

</script>

</body>
</html>
